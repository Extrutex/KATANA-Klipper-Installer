#####################################################################
#  NEXUS A.Z.M.  -  Adaptive Z-Offset & Meshing
#  Industrial first-layer automation suite for Klipper.
#
#  Pure Jinja2 / G-Code. No Python extras, no external dependencies,
#  no [include] of third party modules.
#
#  Hard requirements in printer.cfg:
#    [exclude_object]          -> object metadata for adaptive mesh/purge
#    [bed_mesh]                -> mesh_min / mesh_max define the safe envelope
#    a Z probe / scanner       -> probe, bltouch, smart_effector, scanner, ...
#
#  Recommended in printer.cfg:
#    [quad_gantry_level] or [z_tilt]
#    [firmware_retraction]
#
#  Entry points:
#    NEXUS_START_PRINT / NEXUS_END_PRINT      -> slicer hooks
#    NEXUS_AZM_SELFTEST                       -> commissioning validation
#    NEXUS_AZM_STATUS                         -> runtime introspection
#    NEXUS_AZM_HELP                           -> command reference
#
#  Every tunable lives in [gcode_macro _NEXUS_AZM_CONF]. Never edit the
#  logic blocks below to adapt the module to a machine - edit the config.
#####################################################################


#####################################################################
#  SECTION 1 - CENTRAL CONFIGURATION
#####################################################################

[gcode_macro _NEXUS_AZM_CONF]
description: NEXUS A.Z.M. - central configuration store (no motion)

# ------------------------------------------------------------------
# General
# ------------------------------------------------------------------
variable_version:               "1.1.0"
# Console verbosity: 0 = silent, 1 = errors, 2 = info, 3 = debug (term breakdown)
variable_log_level:             2
# Master bypass. False -> NEXUS_START_PRINT degrades to a plain heat & home.
variable_enable:                True

# ------------------------------------------------------------------
# Dry run - commissioning safety
# ------------------------------------------------------------------
# True -> NEXUS_START_PRINT computes the complete plan from the real job
# metadata (mesh window, probe count, offset terms, purge placement),
# reports it, and executes NO motion and NO heating. This is the
# commissioning path: slice a real job, start it, read the plan, cancel.
# Toggle from the console with NEXUS_AZM_DRYRUN ENABLE=1 / ENABLE=0.
variable_dry_run:               False
# True -> a dry run aborts the job after the report instead of letting the
# slicer G-code run into an unhomed, cold machine.
variable_dry_run_abort:         True

# ------------------------------------------------------------------
# Thermal pre-flight
# ------------------------------------------------------------------
# Probing temperature. 150 C is the TAP/load-cell reference point:
# hot enough to soften residual filament, cold enough to stay below the
# oozing threshold of every common thermoplastic.
variable_probe_temp:            150.0
# Accepted band around probe_temp before probing is allowed (deg C).
variable_probe_temp_band:       5.0
# Bed is soaked at full target during the whole pre-flight.
variable_bed_soak_seconds:      0
# Chamber target is only honoured if a [temperature_fan chamber] or
# [heater_generic chamber] object exists.
variable_chamber_object:        "chamber"

# ------------------------------------------------------------------
# Nozzle scrubbing
# ------------------------------------------------------------------
variable_scrub_enable:          True
# Entry point above the brush. z is the wiping height (brush bristle bite).
variable_scrub_pos:             {"x": 30.0, "y": 350.0, "z": 4.0}
# Stroke length along scrub_axis, measured from scrub_pos.
variable_scrub_stroke:          40.0
variable_scrub_passes:          8
variable_scrub_axis:            "x"
variable_scrub_speed:           250.0
variable_scrub_travel_speed:    350.0
# Safe Z used for every approach/exit travel over the brush assembly.
variable_scrub_z_safe:          12.0
# Optional cold-pull style pre-purge before wiping. Requires a hotend
# temperature above min_extrude_temp - skipped automatically at 150 C.
variable_scrub_purge_mm:        0.0

# ------------------------------------------------------------------
# Gantry / bed leveling
# ------------------------------------------------------------------
# auto | qgl | z_tilt | none
variable_level_method:          "auto"
# True -> level on every print (deterministic), False -> only if not applied.
variable_level_force:           True

# ------------------------------------------------------------------
# Smart adaptive mesh
# ------------------------------------------------------------------
variable_mesh_enable:           True
# Margin added around the object bounding box (mm).
variable_mesh_margin:           5.0
# Target distance between probe points (mm). Point count is derived, not fixed.
variable_mesh_spacing:          35.0
variable_mesh_min_points:       3
variable_mesh_max_points:       9
# Minimum edge length of the probed area. Prevents degenerate 3x3 meshes
# on tiny parts where interpolation error exceeds probe repeatability.
variable_mesh_min_span:         20.0
variable_mesh_profile:          "nexus_adaptive"
# No usable object metadata -> probe the full configured mesh instead of
# aborting the print.
variable_mesh_full_fallback:    True

# ------------------------------------------------------------------
# Dynamic Z-offset model
# ------------------------------------------------------------------
# Starting points per probe type. These are starting points, not final
# values - Step 1 in docs/TUNING.md replaces z_sensor_travel with the
# measured value for the individual machine.
#
#   Voron TAP, printed body (ABS/PC)   travel 0.030  thermal 0.00015
#   Voron TAP, CNC body (aluminium)    travel 0.015  thermal 0.00008
#   Load cell / strain gauge toolhead  travel 0.010  thermal 0.00012
#   Beacon / Cartographer (eddy)       travel 0.005  thermal 0.00010
#   Inductive (Omron, PL-08N)          travel 0.000  thermal 0.00012
#
# A printed TAP body creeps under load and expands with chamber
# temperature - both show up as travel and thermal gain. A CNC body has
# roughly half the parasitic travel and a far lower thermal coefficient,
# which is exactly why it is worth its price in a production cell.
variable_z_enable:              True
# Static machine bias. Keep at 0.0 and calibrate the terms below instead.
variable_z_base:                0.000
# Parasitic travel between physical bed contact and probe trigger event
# (frame flex + sensor deadband). Positive -> nozzle sits lower than Z0.
variable_z_sensor_travel:       0.020
# Fraction of the first layer height that is intentionally compressed.
variable_z_squish_ratio:        0.075
# Nozzle tip land compensation. Reference diameter and gain per mm of
# deviation from that reference.
variable_z_dia_ref:             0.40
variable_z_dia_gain:            0.030
# Thermal elongation of the hotend between probing and printing
# (mm per deg C). Reference is the probing temperature.
variable_z_thermal_gain:        0.00012
variable_z_thermal_ref:         150.0
# Rheological bias per material family (mm). Low viscosity melts spread
# further and need a marginally larger gap to avoid elephant foot.
variable_z_material_bias:       {"PLA": 0.000, "PETG": 0.010, "ABS": 0.005, "ASA": 0.005, "PC": 0.015, "PA": 0.015, "PPS": 0.015, "TPU": 0.020, "PVA": 0.005, "HIPS": 0.005}
# Hard safety clamp on the computed offset. A model that leaves this band
# indicates a broken calibration, not a valid correction.
variable_z_clamp_min:           -0.250
variable_z_clamp_max:            0.250
variable_z_move_speed:          5.0
# Fallbacks when the slicer does not provide geometry.
variable_z_default_nozzle:      0.40
variable_z_default_layer:       0.20

# ------------------------------------------------------------------
# Adaptive purge
# ------------------------------------------------------------------
variable_purge_enable:          True
variable_purge_length:          90.0
# Clearance between object bounding box and purge line (mm).
variable_purge_gap:             6.0
variable_purge_width:           0.90
# 0.0 -> derived as 1.5 * first layer height.
variable_purge_height:          0.00
variable_purge_filament_dia:    1.75
variable_purge_flow_scale:      1.00
# Stationary prime before the line is drawn (mm of filament).
variable_purge_prime_mm:        6.0
variable_purge_retract:         0.60
variable_purge_wipe:            20.0
variable_purge_speed:           900.0
variable_purge_travel_speed:    12000.0
variable_purge_z_hop:           5.0
# Placement preference. First candidate that fits the bed wins.
variable_purge_priority:        ["front", "rear", "left", "right"]

# ------------------------------------------------------------------
# Machine envelope
# ------------------------------------------------------------------
# Safety inset from the kinematic limits used for all NEXUS travels (mm).
variable_bed_inset:             5.0
variable_travel_speed:          18000.0
variable_park_pos:              {"x": 10.0, "y": 10.0, "z": 30.0}

gcode:
  # Configuration container only - intentionally no motion.


#####################################################################
#  SECTION 2 - RUNTIME STATE
#####################################################################

[gcode_macro _NEXUS_AZM_STATE]
description: NEXUS A.Z.M. - volatile runtime state (no motion)
variable_bbox:                  {"valid": False, "x_min": 0.0, "y_min": 0.0, "x_max": 0.0, "y_max": 0.0, "objects": 0}
variable_z_applied:             0.0
variable_z_terms:               {}
variable_nozzle:                0.40
variable_layer:                 0.20
variable_material:              "PLA"
variable_extruder_target:       0.0
variable_bed_target:            0.0
variable_mesh_mode:             "none"
gcode:
  # State container only - intentionally no motion.


#####################################################################
#  SECTION 3 - LOGGING / BRANDING
#####################################################################

[gcode_macro _NEXUS_LOG]
description: Level filtered console output for NEXUS A.Z.M.
gcode:
  {% set level = params.LEVEL|default('INFO')|string|upper %}
  {% set msg   = params.MSG|default('')|string %}
  {% set rank  = {'ERROR': 1, 'WARN': 2, 'INFO': 2, 'DEBUG': 3} %}
  {% set want  = rank.get(level, 2) %}
  {% if want <= printer["gcode_macro _NEXUS_AZM_CONF"].log_level|int %}
    {action_respond_info("[NEXUS " ~ level ~ "] " ~ msg)}
  {% endif %}

[gcode_macro _NEXUS_BANNER]
description: Print the NEXUS A.Z.M. identification banner
gcode:
  {% set v = printer["gcode_macro _NEXUS_AZM_CONF"].version|string %}
  {% set art = [
      "╔═══════════════════════════════════════════════╗",
      "║  ███╗   ██╗███████╗██╗  ██╗██╗   ██╗███████╗  ║",
      "║  ████╗  ██║██╔════╝╚██╗██╔╝██║   ██║██╔════╝  ║",
      "║  ██╔██╗ ██║█████╗   ╚███╔╝ ██║   ██║███████╗  ║",
      "║  ██║╚██╗██║██╔══╝   ██╔██╗ ██║   ██║╚════██║  ║",
      "║  ██║ ╚████║███████╗██╔╝ ██╗╚██████╔╝███████║  ║",
      "║  ╚═╝  ╚═══╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝  ║",
      "╠═══════════════════════════════════════════════╣",
      "║      A.Z.M.  ADAPTIVE Z-OFFSET & MESHING      ║",
      "║   INDUSTRIAL FIRST-LAYER AUTOMATION  v" ~ v ~ "   ║",
      "╚═══════════════════════════════════════════════╝"
  ] %}
  {% for line in art %}
    {action_respond_info(line)}
  {% endfor %}


#####################################################################
#  SECTION 4 - GEOMETRY CORE (object bounding box)
#####################################################################

[gcode_macro _NEXUS_BBOX_COMPUTE]
description: Derive the raw object bounding box from exclude_object metadata
gcode:
  {% set ns = namespace(x0=999999.0, y0=999999.0, x1=-999999.0, y1=-999999.0, n=0, obj=0) %}

  {% if 'exclude_object' in printer %}
    {% set objects  = printer.exclude_object.objects|default([], true) %}
    {% set excluded = printer.exclude_object.excluded_objects|default([], true) %}

    {% for obj in objects %}
      {% if obj.name not in excluded %}
        {% set ns.obj = ns.obj + 1 %}
        # Prefer the convex hull polygon, fall back to the object centre.
        {% set points = obj.polygon if (obj.polygon is defined and obj.polygon) else [obj.center] %}
        {% for p in points %}
          {% if p is iterable and p|length >= 2 %}
            {% set ns.x0 = [ns.x0, p[0]|float]|min %}
            {% set ns.y0 = [ns.y0, p[1]|float]|min %}
            {% set ns.x1 = [ns.x1, p[0]|float]|max %}
            {% set ns.y1 = [ns.y1, p[1]|float]|max %}
            {% set ns.n  = ns.n + 1 %}
          {% endif %}
        {% endfor %}
      {% endif %}
    {% endfor %}
  {% endif %}

  # A valid box needs at least one vertex and a non-inverted extent.
  {% set valid = (ns.n > 0) and (ns.x1 >= ns.x0) and (ns.y1 >= ns.y0) %}
  {% if valid %}
    {% set bb = {'valid': True,
                 'x_min': ns.x0|round(3), 'y_min': ns.y0|round(3),
                 'x_max': ns.x1|round(3), 'y_max': ns.y1|round(3),
                 'objects': ns.obj} %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=bbox VALUE="{bb}"
    _NEXUS_LOG LEVEL=DEBUG MSG="BBox {bb.x_min},{bb.y_min} -> {bb.x_max},{bb.y_max} ({bb.objects} objects)"
  {% else %}
    {% set bb = {'valid': False, 'x_min': 0.0, 'y_min': 0.0, 'x_max': 0.0, 'y_max': 0.0, 'objects': 0} %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=bbox VALUE="{bb}"
    _NEXUS_LOG LEVEL=WARN MSG="No exclude_object geometry available - adaptive features degrade to fallback"
  {% endif %}


#####################################################################
#  SECTION 5 - THERMAL PRE-FLIGHT
#####################################################################

[gcode_macro _NEXUS_PREFLIGHT_THERMAL]
description: Bring bed to target and hotend to the probing temperature
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set bed  = params.BED|default(0)|float %}
  {% set soak = params.SOAK|default(C.bed_soak_seconds)|int %}
  {% set tp   = C.probe_temp|float %}
  {% set band = C.probe_temp_band|float %}

  _NEXUS_LOG LEVEL=INFO MSG="Pre-flight: bed {bed|round(0)}C, probing hotend {tp|round(0)}C"

  # Bed first - it is the slow thermal mass and defines the soak window.
  {% if bed > 0 %}
    M140 S{bed}
  {% endif %}

  # The hotend is driven to the probing setpoint, not to print temperature.
  # Probing hot enough to soften residue, cold enough to stay below the
  # oozing threshold of every common thermoplastic.
  M104 S{tp}

  {% if bed > 0 %}
    M190 S{bed}
  {% endif %}

  # Wait for the hotend inside a symmetric band. M109 would only wait for
  # the rising edge and leaves the melt zone thermally unsettled.
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tp - band} MAXIMUM={tp + band}

  {% if soak > 0 %}
    _NEXUS_LOG LEVEL=INFO MSG="Heat soak {soak}s"
    G4 P{soak * 1000}
  {% endif %}


#####################################################################
#  SECTION 6 - NOZZLE SCRUBBING
#####################################################################

[gcode_macro NEXUS_SCRUB]
description: Automated nozzle scrubbing on the brush assembly
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set p = C.scrub_pos %}
  {% set passes = params.PASSES|default(C.scrub_passes)|int %}
  {% set stroke = params.STROKE|default(C.scrub_stroke)|float %}
  {% set axis   = (params.AXIS|default(C.scrub_axis))|string|lower %}
  {% set amin = printer.toolhead.axis_minimum %}
  {% set amax = printer.toolhead.axis_maximum %}

  {% if not C.scrub_enable %}
    _NEXUS_LOG LEVEL=DEBUG MSG="Scrub disabled by configuration"
  {% elif printer.toolhead.homed_axes != "xyz" %}
    _NEXUS_LOG LEVEL=WARN MSG="Scrub skipped - axes not homed"
  {% else %}
    # Envelope validation. A brush position outside the kinematic limits is
    # a configuration error and must never be executed.
    {% set x_end = p.x + (stroke if axis == 'x' else 0.0) %}
    {% set y_end = p.y + (stroke if axis == 'y' else 0.0) %}
    {% if p.x < amin.x or p.x > amax.x or p.y < amin.y or p.y > amax.y
       or x_end < amin.x or x_end > amax.x or y_end < amin.y or y_end > amax.y %}
      {action_raise_error("NEXUS: scrub_pos/scrub_stroke leave the machine envelope")}
    {% endif %}

    _NEXUS_LOG LEVEL=INFO MSG="Nozzle scrub: {passes} passes, {stroke|round(1)}mm on {axis|upper}"

    SAVE_GCODE_STATE NAME=NEXUS_SCRUB
    G90
    G1 Z{C.scrub_z_safe} F1200
    G1 X{p.x} Y{p.y} F{C.travel_speed}

    # Optional pre-purge. Only executed if the melt zone is actually above
    # min_extrude_temp - at the 150 C probing setpoint this is a no-op.
    {% set min_ex = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if C.scrub_purge_mm|float > 0 and printer.extruder.temperature|float > min_ex %}
      M83
      G1 E{C.scrub_purge_mm} F180
      G1 E-{C.purge_retract} F2100
    {% endif %}

    G1 Z{p.z} F600
    {% for i in range(passes) %}
      {% if axis == 'y' %}
        G1 Y{p.y + stroke} F{C.scrub_speed * 60}
        G1 Y{p.y} F{C.scrub_speed * 60}
      {% else %}
        G1 X{p.x + stroke} F{C.scrub_speed * 60}
        G1 X{p.x} F{C.scrub_speed * 60}
      {% endif %}
    {% endfor %}

    G1 Z{C.scrub_z_safe} F1200
    RESTORE_GCODE_STATE NAME=NEXUS_SCRUB MOVE=0
    _NEXUS_LOG LEVEL=DEBUG MSG="Scrub complete"
  {% endif %}


#####################################################################
#  SECTION 7 - GANTRY / BED LEVELING
#####################################################################

[gcode_macro _NEXUS_LEVEL]
description: Execute quad gantry leveling or Z tilt adjustment if available
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set ns = namespace(method=C.level_method|string|lower) %}

  {% if ns.method == 'auto' %}
    {% if 'quad_gantry_level' in printer %}
      {% set ns.method = 'qgl' %}
    {% elif 'z_tilt' in printer %}
      {% set ns.method = 'z_tilt' %}
    {% else %}
      {% set ns.method = 'none' %}
    {% endif %}
  {% endif %}

  {% if ns.method == 'qgl' and 'quad_gantry_level' in printer %}
    {% if C.level_force or not printer.quad_gantry_level.applied %}
      _NEXUS_LOG LEVEL=INFO MSG="Quad gantry leveling"
      QUAD_GANTRY_LEVEL
      G28 Z
    {% else %}
      _NEXUS_LOG LEVEL=DEBUG MSG="QGL already applied"
    {% endif %}
  {% elif ns.method == 'z_tilt' and 'z_tilt' in printer %}
    {% if C.level_force or not printer.z_tilt.applied %}
      _NEXUS_LOG LEVEL=INFO MSG="Z tilt adjust"
      Z_TILT_ADJUST
      G28 Z
    {% else %}
      _NEXUS_LOG LEVEL=DEBUG MSG="Z tilt already applied"
    {% endif %}
  {% else %}
    _NEXUS_LOG LEVEL=DEBUG MSG="No gantry leveling configured"
  {% endif %}


#####################################################################
#  SECTION 8 - SMART ADAPTIVE MESH
#####################################################################

[gcode_macro NEXUS_ADAPTIVE_MESH]
description: Probe only the area actually covered by the print objects
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set S = printer["gcode_macro _NEXUS_AZM_STATE"] %}
  {% set margin  = params.MARGIN|default(C.mesh_margin)|float %}
  {% set spacing = params.SPACING|default(C.mesh_spacing)|float %}
  {% set profile = params.PROFILE|default(C.mesh_profile)|string %}
  # PLAN=1 computes and reports the window without probing anything.
  {% set plan = params.PLAN|default(0)|int %}

  {% if 'bed_mesh' not in printer.configfile.settings %}
    _NEXUS_LOG LEVEL=ERROR MSG="No [bed_mesh] section - meshing skipped"
  {% else %}
    {% set mcfg = printer.configfile.settings.bed_mesh %}
    {% set lim_min = mcfg.mesh_min %}
    {% set lim_max = mcfg.mesh_max %}
    {% set bb = S.bbox %}

    {% if not plan %}
      BED_MESH_CLEAR
    {% endif %}

    {% if not bb.valid %}
      # ---- Fallback: no slicer object metadata ----------------------
      {% if C.mesh_full_fallback %}
        _NEXUS_LOG LEVEL=WARN MSG="Adaptive mesh unavailable - probing full bed"
        SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=mesh_mode VALUE='"full"'
        {% if not plan %}
          BED_MESH_CALIBRATE PROFILE={profile}
        {% endif %}
      {% else %}
        {action_raise_error("NEXUS: no exclude_object data and mesh_full_fallback disabled")}
      {% endif %}
    {% else %}
      # ---- Adaptive path --------------------------------------------
      {% set ns = namespace(x0=bb.x_min - margin, y0=bb.y_min - margin,
                            x1=bb.x_max + margin, y1=bb.y_max + margin) %}

      # A zero_reference_position outside the probed area invalidates the
      # mesh reference. Grow the box so the reference point stays inside.
      {% if mcfg.zero_reference_position is defined and mcfg.zero_reference_position %}
        {% set zr = mcfg.zero_reference_position %}
        {% set ns.x0 = [ns.x0, zr[0]|float]|min %}
        {% set ns.y0 = [ns.y0, zr[1]|float]|min %}
        {% set ns.x1 = [ns.x1, zr[0]|float]|max %}
        {% set ns.y1 = [ns.y1, zr[1]|float]|max %}
      {% endif %}

      # Enforce a minimum probed span. Below this the interpolation error
      # of the surface fit exceeds the repeatability of the probe itself.
      {% if (ns.x1 - ns.x0) < C.mesh_min_span|float %}
        {% set cx = (ns.x0 + ns.x1) / 2.0 %}
        {% set ns.x0 = cx - C.mesh_min_span|float / 2.0 %}
        {% set ns.x1 = cx + C.mesh_min_span|float / 2.0 %}
      {% endif %}
      {% if (ns.y1 - ns.y0) < C.mesh_min_span|float %}
        {% set cy = (ns.y0 + ns.y1) / 2.0 %}
        {% set ns.y0 = cy - C.mesh_min_span|float / 2.0 %}
        {% set ns.y1 = cy + C.mesh_min_span|float / 2.0 %}
      {% endif %}

      # Fit the window into the configured probe envelope by TRANSLATION,
      # not by collapsing it. mesh_min/mesh_max already account for the probe
      # offsets and the kinematic limits, so this is the single authority for
      # out-of-bounds protection. A part sitting outside the probeable area
      # therefore still gets a full width mesh window next to it instead of a
      # degenerate one - probing something valid beats probing nothing.
      {% set span_x = [ns.x1 - ns.x0, lim_max[0]|float - lim_min[0]|float]|min %}
      {% set span_y = [ns.y1 - ns.y0, lim_max[1]|float - lim_min[1]|float]|min %}
      {% set ns.x0 = [[ns.x0, lim_min[0]|float]|max, lim_max[0]|float - span_x]|min %}
      {% set ns.y0 = [[ns.y0, lim_min[1]|float]|max, lim_max[1]|float - span_y]|min %}
      {% set ns.x1 = ns.x0 + span_x %}
      {% set ns.y1 = ns.y0 + span_y %}

      {% if ns.x1 <= ns.x0 or ns.y1 <= ns.y0 %}
        _NEXUS_LOG LEVEL=WARN MSG="Clamped mesh area degenerated - probing full bed"
        SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=mesh_mode VALUE='"full"'
        {% if not plan %}
          BED_MESH_CALIBRATE PROFILE={profile}
        {% endif %}
      {% else %}
        # Point count follows the requested spacing, clamped to the
        # configured limits. Always at least 3 points per axis.
        {% set px = (((ns.x1 - ns.x0) / spacing)|round(0, 'ceil')|int) + 1 %}
        {% set py = (((ns.y1 - ns.y0) / spacing)|round(0, 'ceil')|int) + 1 %}
        {% set px = [[px, C.mesh_min_points|int]|max, C.mesh_max_points|int]|min %}
        {% set py = [[py, C.mesh_min_points|int]|max, C.mesh_max_points|int]|min %}

        # Bicubic interpolation requires >= 4 points per axis. Anything
        # smaller must use lagrange or Klipper aborts the calibration.
        {% set algo = 'bicubic' if (px >= 4 and py >= 4) else 'lagrange' %}

        # A full bed at this spacing would cost this many probe points -
        # the number that justifies the whole module in a production cell.
        {% set fx = ((((lim_max[0]|float - lim_min[0]|float) / spacing)|round(0, 'ceil')|int) + 1) %}
        {% set fy = ((((lim_max[1]|float - lim_min[1]|float) / spacing)|round(0, 'ceil')|int) + 1) %}

        _NEXUS_LOG LEVEL=INFO MSG="Adaptive mesh {ns.x0|round(1)},{ns.y0|round(1)} -> {ns.x1|round(1)},{ns.y1|round(1)} | {px}x{py} pts | {algo} | full bed would be {fx}x{fy}"
        SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=mesh_mode VALUE='"adaptive"'

        {% if not plan %}
          BED_MESH_CALIBRATE PROFILE={profile} MESH_MIN={ns.x0|round(3)},{ns.y0|round(3)} MESH_MAX={ns.x1|round(3)},{ns.y1|round(3)} PROBE_COUNT={px},{py} ALGORITHM={algo}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}


#####################################################################
#  SECTION 9 - DYNAMIC Z-OFFSET
#####################################################################

[gcode_macro NEXUS_Z_OFFSET]
description: Compute and apply the first layer Z-offset from slicer geometry
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set ns = namespace(noz=params.NOZZLE|default(C.z_default_nozzle)|float,
                        lay=params.LAYER|default(C.z_default_layer)|float) %}
  {% set mat   = (params.MATERIAL|default('PLA'))|string|upper|trim %}
  {% set tgt   = params.EXTRUDER_TEMP|default(printer.extruder.target)|float %}
  {% set extra = params.EXTRA|default(0.0)|float %}
  # PLAN=1 computes and reports the terms without touching the offset.
  {% set plan  = params.PLAN|default(0)|int %}

  # ---- Input validation with deterministic fallbacks -----------------
  {% if ns.noz < 0.10 or ns.noz > 2.00 %}
    _NEXUS_LOG LEVEL=WARN MSG="Implausible nozzle diameter {ns.noz} - falling back to {C.z_default_nozzle}"
    {% set ns.noz = C.z_default_nozzle|float %}
  {% endif %}
  {% if ns.lay < 0.02 or ns.lay > 1.20 %}
    _NEXUS_LOG LEVEL=WARN MSG="Implausible layer height {ns.lay} - falling back to {C.z_default_layer}"
    {% set ns.lay = C.z_default_layer|float %}
  {% endif %}
  {% if ns.lay > ns.noz * 0.85 %}
    _NEXUS_LOG LEVEL=WARN MSG="Layer height {ns.lay} exceeds 85% of nozzle diameter {ns.noz} - bonding is extrusion limited"
  {% endif %}

  # ---- Material lookup, tolerant to slicer suffixes (PLA-CF, PA6-GF) --
  {% set bias_map = C.z_material_bias %}
  {% set root = mat.split('-')[0].split('_')[0].split(' ')[0] %}
  {% set t_mat = bias_map.get(mat, bias_map.get(root, 0.0))|float %}

  # ---- Model terms ---------------------------------------------------
  # 1) Sensor travel: parasitic motion between physical bed contact and
  #    the trigger event. The machine believes Z0 is lower than reality,
  #    so the correction is positive.
  {% set t_travel = C.z_sensor_travel|float %}

  # 2) Squish: intentional compression of the first layer against the
  #    plate. Scales with layer height, therefore negative.
  {% set t_squish = -1.0 * C.z_squish_ratio|float * ns.lay %}

  # 3) Tip land: a larger nozzle has a wider flat land, so identical
  #    absolute squish produces a much higher contact pressure.
  {% set t_dia = C.z_dia_gain|float * (ns.noz - C.z_dia_ref|float) %}

  # 4) Thermal: the hotend elongates between the 150 C probing point and
  #    the print temperature, closing the gap mechanically.
  {% set t_therm = C.z_thermal_gain|float * (tgt - C.z_thermal_ref|float) %}

  # 5) Rheology: low viscosity melts spread further at identical gap.
  {% set z_raw = C.z_base|float + t_travel + t_squish + t_dia + t_therm + t_mat + extra %}
  {% set z_fin = [[z_raw, C.z_clamp_min|float]|max, C.z_clamp_max|float]|min %}

  {% if z_fin != z_raw %}
    _NEXUS_LOG LEVEL=WARN MSG="Computed offset {z_raw|round(4)} clamped to {z_fin|round(4)} - verify the model coefficients"
  {% endif %}

  {% set terms = {'travel': t_travel|round(4), 'squish': t_squish|round(4),
                  'dia': t_dia|round(4), 'thermal': t_therm|round(4),
                  'material': t_mat|round(4), 'extra': extra|round(4),
                  'total': z_fin|round(4)} %}

  {% if plan %}
    _NEXUS_LOG LEVEL=INFO MSG="Dynamic Z-offset would be {z_fin|round(4)}mm | nozzle {ns.noz} | layer {ns.lay} | {mat} @ {tgt|round(0)}C"
    _NEXUS_LOG LEVEL=INFO MSG="terms travel={t_travel|round(4)} squish={t_squish|round(4)} dia={t_dia|round(4)} thermal={t_therm|round(4)} material={t_mat|round(4)} extra={extra|round(4)}"
  {% elif C.z_enable %}
    _NEXUS_LOG LEVEL=INFO MSG="Dynamic Z-offset {z_fin|round(4)}mm | nozzle {ns.noz} | layer {ns.lay} | {mat} @ {tgt|round(0)}C"
    _NEXUS_LOG LEVEL=DEBUG MSG="terms travel={t_travel|round(4)} squish={t_squish|round(4)} dia={t_dia|round(4)} thermal={t_therm|round(4)} material={t_mat|round(4)} extra={extra|round(4)}"
    {% if 'z' in printer.toolhead.homed_axes %}
      SET_GCODE_OFFSET Z={z_fin|round(4)} MOVE=1 MOVE_SPEED={C.z_move_speed}
    {% else %}
      SET_GCODE_OFFSET Z={z_fin|round(4)} MOVE=0
      _NEXUS_LOG LEVEL=WARN MSG="Z not homed - offset staged without compensating move"
    {% endif %}
  {% else %}
    _NEXUS_LOG LEVEL=INFO MSG="Dynamic Z-offset disabled - would have applied {z_fin|round(4)}mm"
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=z_applied VALUE={z_fin|round(4)}
  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=z_terms VALUE="{terms}"
  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=nozzle VALUE={ns.noz}
  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=layer VALUE={ns.lay}
  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=material VALUE='"{mat}"'


#####################################################################
#  SECTION 10 - ADAPTIVE PURGE
#####################################################################

[gcode_macro NEXUS_ADAPTIVE_PURGE]
description: Draw a purge line adjacent to the object bounding box
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set S = printer["gcode_macro _NEXUS_AZM_STATE"] %}
  {% set bb = S.bbox %}
  {% set amin = printer.toolhead.axis_minimum %}
  {% set amax = printer.toolhead.axis_maximum %}
  {% set inset = C.bed_inset|float %}
  {% set gap   = params.GAP|default(C.purge_gap)|float %}
  # PLAN=1 reports the placement without moving or extruding. The hardware
  # guards below are bypassed so the plan is reportable on a cold, unhomed
  # machine - the point of a dry run.
  {% set plan  = params.PLAN|default(0)|int %}

  # Usable rectangle for any NEXUS motion.
  {% set bx0 = amin.x|float + inset %}
  {% set by0 = amin.y|float + inset %}
  {% set bx1 = amax.x|float - inset %}
  {% set by1 = amax.y|float - inset %}

  {% set h = C.purge_height|float if C.purge_height|float > 0 else (S.layer|float * 1.5) %}
  {% set w = C.purge_width|float %}
  {% set area = 3.14159265 * ((C.purge_filament_dia|float) ** 2) / 4.0 %}
  {% set min_ex = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

  {% if not C.purge_enable %}
    _NEXUS_LOG LEVEL=DEBUG MSG="Purge disabled by configuration"
  {% elif not plan and printer.toolhead.homed_axes != "xyz" %}
    _NEXUS_LOG LEVEL=WARN MSG="Purge skipped - axes not homed"
  {% elif not plan and printer.extruder.temperature|float < min_ex %}
    _NEXUS_LOG LEVEL=WARN MSG="Purge skipped - hotend below min_extrude_temp"
  {% else %}
    # ---- Deterministic placement search ------------------------------
    # Candidates are evaluated in the configured priority order. The first
    # side that keeps the whole line inside the usable rectangle wins.
    {% set ns = namespace(plan=None) %}

    {% if bb.valid %}
      {% for side in C.purge_priority %}
        {% if ns.plan is none %}
          {% if side == 'front' and (bb.y_min|float - gap) >= by0 %}
            {% set L = [C.purge_length|float, bx1 - bx0]|min %}
            {% set sx = [[bb.x_min|float, bx0]|max, bx1 - L]|min %}
            {% set ns.plan = {'x': sx, 'y': bb.y_min|float - gap, 'dx': 1.0, 'dy': 0.0, 'len': L, 'side': 'front'} %}
          {% elif side == 'rear' and (bb.y_max|float + gap) <= by1 %}
            {% set L = [C.purge_length|float, bx1 - bx0]|min %}
            {% set sx = [[bb.x_min|float, bx0]|max, bx1 - L]|min %}
            {% set ns.plan = {'x': sx, 'y': bb.y_max|float + gap, 'dx': 1.0, 'dy': 0.0, 'len': L, 'side': 'rear'} %}
          {% elif side == 'left' and (bb.x_min|float - gap) >= bx0 %}
            {% set L = [C.purge_length|float, by1 - by0]|min %}
            {% set sy = [[bb.y_min|float, by0]|max, by1 - L]|min %}
            {% set ns.plan = {'x': bb.x_min|float - gap, 'y': sy, 'dx': 0.0, 'dy': 1.0, 'len': L, 'side': 'left'} %}
          {% elif side == 'right' and (bb.x_max|float + gap) <= bx1 %}
            {% set L = [C.purge_length|float, by1 - by0]|min %}
            {% set sy = [[bb.y_min|float, by0]|max, by1 - L]|min %}
            {% set ns.plan = {'x': bb.x_max|float + gap, 'y': sy, 'dx': 0.0, 'dy': 1.0, 'len': L, 'side': 'right'} %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}

    {% if ns.plan is none %}
      # Fallback: front left corner of the usable rectangle.
      {% set L = [C.purge_length|float, bx1 - bx0]|min %}
      {% set ns.plan = {'x': bx0, 'y': by0, 'dx': 1.0, 'dy': 0.0, 'len': L, 'side': 'fallback'} %}
      _NEXUS_LOG LEVEL=WARN MSG="No adjacent purge site found - using bed corner"
    {% endif %}

    {% set pl = ns.plan %}
    {% set e_line = (pl.len * w * h) / area * C.purge_flow_scale|float %}
    {% set x_end  = pl.x + pl.dx * pl.len %}
    {% set y_end  = pl.y + pl.dy * pl.len %}
    # Wipe travels in the direction of the line and is truncated by the
    # remaining envelope, never by the opposite side of the bed.
    {% set avail  = (bx1 - x_end) if pl.dx > 0 else (by1 - y_end) %}
    {% set wipe   = [[C.purge_wipe|float, avail]|min, 0.0]|max %}
    {% set x_wipe = x_end + pl.dx * wipe %}
    {% set y_wipe = y_end + pl.dy * wipe %}

    _NEXUS_LOG LEVEL=INFO MSG="Adaptive purge [{pl.side}] {pl.x|round(1)},{pl.y|round(1)} -> {x_end|round(1)},{y_end|round(1)} | {e_line|round(2)}mm filament | line {h|round(2)}x{w|round(2)}mm"

    {% if plan %}
      _NEXUS_LOG LEVEL=INFO MSG="PLAN only - no motion, no extrusion"
    {% else %}
    SAVE_GCODE_STATE NAME=NEXUS_PURGE
    G90
    M83
    G1 Z{C.purge_z_hop} F1200
    G1 X{pl.x|round(3)} Y{pl.y|round(3)} F{C.purge_travel_speed}
    G1 Z{h|round(3)} F600

    # Stationary prime rebuilds melt pressure after the cold travel.
    G1 E{C.purge_prime_mm} F180

    # Single continuous line - no retract inside the line, pressure stays
    # constant and the extrudate keeps a defined cross section.
    G1 X{x_end|round(3)} Y{y_end|round(3)} E{e_line|round(4)} F{C.purge_speed}

    G1 E-{C.purge_retract} F2100
    # Non extruding wipe breaks the filament string off the deposited line.
    G1 X{x_wipe|round(3)} Y{y_wipe|round(3)} F{C.purge_travel_speed}
    G1 Z{C.purge_z_hop} F1200
    RESTORE_GCODE_STATE NAME=NEXUS_PURGE MOVE=0
    {% endif %}
  {% endif %}


#####################################################################
#  SECTION 11 - ORCHESTRATION
#####################################################################

[gcode_macro NEXUS_START_PRINT]
description: NEXUS A.Z.M. print start sequence - call this from the slicer
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set bed    = params.BED|default(params.BED_TEMP)|default(60)|float %}
  {% set hotend = params.EXTRUDER|default(params.EXTRUDER_TEMP)|default(210)|float %}
  {% set nozzle = params.NOZZLE|default(C.z_default_nozzle)|float %}
  {% set layer  = params.LAYER|default(C.z_default_layer)|float %}
  {% set mat    = (params.MATERIAL|default(params.FILAMENT_TYPE)|default('PLA'))|string|upper|trim %}
  {% set do_mesh  = params.MESH|default(1)|int %}
  {% set do_purge = params.PURGE|default(1)|int %}
  {% set do_scrub = params.SCRUB|default(1)|int %}
  {% set z_extra  = params.Z_EXTRA|default(0.0)|float %}

  _NEXUS_BANNER

  {% if C.dry_run %}
    # ---- Commissioning path -----------------------------------------
    # The full plan is computed from the real job metadata. Nothing moves,
    # nothing heats. See docs/COMMISSIONING.md.
    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=extruder_target VALUE={hotend}
    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=bed_target VALUE={bed}
    NEXUS_AZM_PLAN NOZZLE={nozzle} LAYER={layer} MATERIAL={mat} EXTRUDER={hotend} Z_EXTRA={z_extra}
    {% if C.dry_run_abort %}
      {action_raise_error("NEXUS DRY RUN - job aborted by design. Set dry_run to False to print.")}
    {% else %}
      _NEXUS_LOG LEVEL=WARN MSG="DRY RUN complete - machine is unhomed and cold, cancel the job now"
    {% endif %}
  {% elif not C.enable %}
    _NEXUS_LOG LEVEL=WARN MSG="NEXUS disabled - executing minimal start sequence"
    SET_GCODE_OFFSET Z=0 MOVE=0
    M140 S{bed}
    G28
    M190 S{bed}
    M109 S{hotend}
  {% else %}
    _NEXUS_LOG LEVEL=INFO MSG="Job: {mat} | nozzle {nozzle} | layer {layer} | {hotend|round(0)}C / {bed|round(0)}C"

    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=extruder_target VALUE={hotend}
    SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_STATE VARIABLE=bed_target VALUE={bed}

    # --- 0) Deterministic machine state ----------------------------
    G21
    G90
    M83
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR

    # --- 1) Thermal pre-flight (bed target + 150 C probing setpoint) -
    _NEXUS_PREFLIGHT_THERMAL BED={bed}

    # --- 2) Provisional homing at probing temperature ---------------
    # The nozzle is hot enough for a safe TAP/load-cell contact but this
    # reference is explicitly treated as provisional - it was taken with
    # an unclean nozzle and is discarded again in step 4.
    G28

    # --- 3) Nozzle scrubbing ----------------------------------------
    {% if do_scrub %}
      NEXUS_SCRUB
    {% endif %}

    # --- 4) Authoritative Z reference with a clean nozzle ------------
    G28 Z

    # --- 5) Gantry leveling -----------------------------------------
    _NEXUS_LEVEL

    # --- 6) Object geometry + adaptive mesh -------------------------
    _NEXUS_BBOX_COMPUTE
    {% if do_mesh and C.mesh_enable %}
      NEXUS_ADAPTIVE_MESH
    {% else %}
      _NEXUS_LOG LEVEL=DEBUG MSG="Meshing skipped"
    {% endif %}

    # --- 7) Dynamic Z-offset ----------------------------------------
    NEXUS_Z_OFFSET NOZZLE={nozzle} LAYER={layer} MATERIAL={mat} EXTRUDER_TEMP={hotend} EXTRA={z_extra}

    # --- 8) Final heat up -------------------------------------------
    # Only now, with every probing operation completed, the hotend is
    # driven to print temperature. Oozing can no longer contaminate a
    # measurement.
    _NEXUS_LOG LEVEL=INFO MSG="Heating to print temperature {hotend|round(0)}C"
    M109 S{hotend}

    # --- 9) Adaptive purge ------------------------------------------
    {% if do_purge %}
      NEXUS_ADAPTIVE_PURGE
    {% endif %}

    G92 E0
    _NEXUS_LOG LEVEL=INFO MSG="Pre-flight complete - starting job"
  {% endif %}

[gcode_macro NEXUS_END_PRINT]
description: NEXUS A.Z.M. print end sequence - call this from the slicer
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set p = C.park_pos %}
  {% set amax = printer.toolhead.axis_maximum %}
  {% set z_park = [printer.toolhead.position.z|float + p.z|float, amax.z|float - 2.0]|min %}

  SAVE_GCODE_STATE NAME=NEXUS_END
  M83
  G1 E-3.0 F2100
  TURN_OFF_HEATERS
  G90
  {% if 'z' in printer.toolhead.homed_axes %}
    G1 Z{z_park|round(3)} F1200
  {% endif %}
  {% if printer.toolhead.homed_axes == "xyz" %}
    G1 X{p.x} Y{p.y} F{C.travel_speed}
  {% endif %}
  M107
  SET_GCODE_OFFSET Z=0 MOVE=0
  BED_MESH_CLEAR
  RESTORE_GCODE_STATE NAME=NEXUS_END MOVE=0
  M84
  _NEXUS_LOG LEVEL=INFO MSG="Job finished - machine parked"


#####################################################################
#  SECTION 12 - DIAGNOSTICS
#####################################################################

[gcode_macro NEXUS_AZM_PLAN]
description: Report the complete pre-flight plan without moving or heating
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set nozzle = params.NOZZLE|default(C.z_default_nozzle)|float %}
  {% set layer  = params.LAYER|default(C.z_default_layer)|float %}
  {% set mat    = (params.MATERIAL|default('PLA'))|string|upper|trim %}
  {% set hotend = params.EXTRUDER|default(printer.extruder.target)|float %}
  {% set extra  = params.Z_EXTRA|default(0.0)|float %}

  # Emitted as commands, not as inline action_respond_info: Klipper renders
  # the whole template before executing any of it, so an inline responder
  # would print the header before the nested macros it is framing.
  _NEXUS_LOG LEVEL=INFO MSG="--- NEXUS A.Z.M. PLAN -------------------------"
  _NEXUS_LOG LEVEL=INFO MSG="Job: {mat} | nozzle {nozzle} | layer {layer} | {hotend|round(0)}C"

  # Same code path as a real job - PLAN=1 only suppresses the hardware
  # commands, never the computation. A plan that differs from the run it
  # predicts would be worthless.
  _NEXUS_BBOX_COMPUTE
  NEXUS_ADAPTIVE_MESH PLAN=1
  NEXUS_Z_OFFSET NOZZLE={nozzle} LAYER={layer} MATERIAL={mat} EXTRUDER_TEMP={hotend} EXTRA={extra} PLAN=1
  NEXUS_ADAPTIVE_PURGE PLAN=1
  _NEXUS_LOG LEVEL=INFO MSG="--- END PLAN - nothing was executed -----------"

[gcode_macro NEXUS_AZM_DRYRUN]
description: Toggle commissioning dry run (ENABLE=1 plans only, ENABLE=0 prints)
gcode:
  {% set on = params.ENABLE|default(1)|int %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_AZM_CONF VARIABLE=dry_run VALUE={'True' if on else 'False'}
  {% if on %}
    _NEXUS_LOG LEVEL=WARN MSG="DRY RUN ARMED - NEXUS_START_PRINT will plan and abort, not print"
  {% else %}
    _NEXUS_LOG LEVEL=INFO MSG="Dry run disabled - NEXUS_START_PRINT executes normally"
  {% endif %}
  _NEXUS_LOG LEVEL=INFO MSG="This survives until the next RESTART - set variable_dry_run in the config to persist it"

[gcode_macro NEXUS_AZM_STATUS]
description: Dump the current NEXUS A.Z.M. runtime state
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set S = printer["gcode_macro _NEXUS_AZM_STATE"] %}
  {action_respond_info(
    "NEXUS A.Z.M. v" ~ C.version ~ "\n"
    ~ "  enabled       : " ~ C.enable ~ "\n"
    ~ "  dry run       : " ~ C.dry_run ~ "\n"
    ~ "  material      : " ~ S.material ~ "\n"
    ~ "  nozzle/layer  : " ~ S.nozzle ~ " / " ~ S.layer ~ "\n"
    ~ "  targets       : " ~ S.extruder_target ~ "C hotend / " ~ S.bed_target ~ "C bed\n"
    ~ "  mesh mode     : " ~ S.mesh_mode ~ "\n"
    ~ "  bounding box  : " ~ S.bbox ~ "\n"
    ~ "  z applied     : " ~ S.z_applied ~ " mm\n"
    ~ "  z terms       : " ~ S.z_terms ~ "\n"
    ~ "  live offset   : " ~ printer.gcode_move.homing_origin.z ~ " mm"
  )}

[gcode_macro NEXUS_AZM_SELFTEST]
description: Validate the NEXUS A.Z.M. installation against this machine
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {% set s = printer.configfile.settings %}
  {% set amin = printer.toolhead.axis_minimum %}
  {% set amax = printer.toolhead.axis_maximum %}
  {% set ns = namespace(fail=0, warn=0) %}

  _NEXUS_BANNER
  {action_respond_info("NEXUS A.Z.M. self test")}

  {% if 'exclude_object' not in printer %}
    {% set ns.fail = ns.fail + 1 %}
    {action_respond_info("  [FAIL] [exclude_object] is not configured")}
  {% else %}
    {action_respond_info("  [ OK ] exclude_object present")}
  {% endif %}

  {% if 'bed_mesh' not in s %}
    {% set ns.fail = ns.fail + 1 %}
    {action_respond_info("  [FAIL] [bed_mesh] is not configured")}
  {% else %}
    {action_respond_info("  [ OK ] bed_mesh envelope " ~ s.bed_mesh.mesh_min ~ " -> " ~ s.bed_mesh.mesh_max)}
  {% endif %}

  {% set probes = ['probe', 'bltouch', 'smart_effector', 'scanner', 'probe_eddy_current', 'load_cell_probe'] %}
  {% set found = probes|select('in', s)|list %}
  {% if found|length == 0 %}
    {% set ns.fail = ns.fail + 1 %}
    {action_respond_info("  [FAIL] no Z probe section detected")}
  {% else %}
    {action_respond_info("  [ OK ] probe: " ~ found|join(', '))}
  {% endif %}

  {% if C.scrub_enable %}
    {% set p = C.scrub_pos %}
    {% set xe = p.x + (C.scrub_stroke|float if C.scrub_axis|lower == 'x' else 0.0) %}
    {% set ye = p.y + (C.scrub_stroke|float if C.scrub_axis|lower == 'y' else 0.0) %}
    {% if p.x < amin.x or p.x > amax.x or p.y < amin.y or p.y > amax.y or xe < amin.x or xe > amax.x or ye < amin.y or ye > amax.y %}
      {% set ns.fail = ns.fail + 1 %}
      {action_respond_info("  [FAIL] scrub path leaves the machine envelope")}
    {% else %}
      {action_respond_info("  [ OK ] scrub path inside envelope")}
    {% endif %}
  {% else %}
    {% set ns.warn = ns.warn + 1 %}
    {action_respond_info("  [WARN] nozzle scrubbing disabled")}
  {% endif %}

  {% if C.probe_temp|float > 180.0 %}
    {% set ns.warn = ns.warn + 1 %}
    {action_respond_info("  [WARN] probe_temp above 180C - oozing will corrupt the Z reference")}
  {% else %}
    {action_respond_info("  [ OK ] probe_temp " ~ C.probe_temp ~ "C")}
  {% endif %}

  {% if C.z_clamp_min|float >= C.z_clamp_max|float %}
    {% set ns.fail = ns.fail + 1 %}
    {action_respond_info("  [FAIL] z_clamp_min >= z_clamp_max")}
  {% else %}
    {action_respond_info("  [ OK ] z clamp band " ~ C.z_clamp_min ~ " .. " ~ C.z_clamp_max ~ " mm")}
  {% endif %}

  {% if 'quad_gantry_level' in printer or 'z_tilt' in printer %}
    {action_respond_info("  [ OK ] gantry leveling available")}
  {% else %}
    {% set ns.warn = ns.warn + 1 %}
    {action_respond_info("  [WARN] no quad_gantry_level / z_tilt configured")}
  {% endif %}

  {action_respond_info("Result: " ~ ns.fail ~ " failed, " ~ ns.warn ~ " warnings")}
  {% if ns.fail > 0 %}
    {action_raise_error("NEXUS self test failed - resolve the [FAIL] items before printing")}
  {% endif %}

