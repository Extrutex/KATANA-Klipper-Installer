#####################################################################
#  NEXUS A.Z.M. - KAMP COMPATIBILITY LAYER
#
#  Optional. Include this ONLY after KAMP has been removed from
#  printer.cfg - Klipper rejects duplicate macro names, and that error
#  is the intended guard against running both at once.
#
#      [include nexus_azm.cfg]
#      [include nexus_kamp_compat.cfg]
#
#  Purpose: existing slicer profiles, filament profiles and start G-code
#  that call KAMP macros keep working unchanged while the machine is
#  migrated. Nothing here adds behaviour - every macro forwards to its
#  NEXUS equivalent.
#
#  This is a migration aid, not a permanent installation. Once the slicer
#  profiles call NEXUS_START_PRINT, remove the include.
#####################################################################

[gcode_macro LINE_PURGE]
description: KAMP compatibility - forwards to NEXUS_ADAPTIVE_PURGE
gcode:
  # KAMP's LINE_PURGE takes no parameters and reads its settings from
  # KAMP_Settings.cfg. NEXUS reads _NEXUS_AZM_CONF instead, so the call
  # is forwarded unchanged and the configuration follows the module.
  _NEXUS_LOG LEVEL=DEBUG MSG="LINE_PURGE (KAMP compat) -> NEXUS_ADAPTIVE_PURGE"
  NEXUS_ADAPTIVE_PURGE PATTERN=line

[gcode_macro VORON_PURGE]
description: KAMP compatibility - forwards to NEXUS_ADAPTIVE_PURGE
gcode:
  # KAMP's VORON_PURGE draws a two-segment bracket. The NEXUS equivalent
  # with comparable material throughput is the two-line serpentine.
  _NEXUS_LOG LEVEL=DEBUG MSG="VORON_PURGE (KAMP compat) -> NEXUS_ADAPTIVE_PURGE PATTERN=double"
  NEXUS_ADAPTIVE_PURGE PATTERN=double

[gcode_macro SMART_PARK]
description: KAMP compatibility - forwards to NEXUS_SMART_PARK
gcode:
  _NEXUS_LOG LEVEL=DEBUG MSG="SMART_PARK (KAMP compat) -> NEXUS_SMART_PARK"
  NEXUS_SMART_PARK

[gcode_macro ADAPTIVE_BED_MESH]
description: KAMP compatibility - forwards to NEXUS_ADAPTIVE_MESH
gcode:
  # The bounding box is recomputed first: a KAMP-era start sequence calls
  # the mesh directly, without a NEXUS pre-flight having run before it.
  _NEXUS_LOG LEVEL=DEBUG MSG="ADAPTIVE_BED_MESH (KAMP compat) -> NEXUS_ADAPTIVE_MESH"
  _NEXUS_BBOX_COMPUTE
  NEXUS_ADAPTIVE_MESH

[gcode_macro KAMP_MIGRATION_STATUS]
description: Report what a KAMP setup needs to change for NEXUS A.Z.M.
gcode:
  {% set C = printer["gcode_macro _NEXUS_AZM_CONF"] %}
  {action_respond_info(
    "KAMP -> NEXUS A.Z.M. migration\n"
    ~ "\n"
    ~ "  Forwarded, safe to keep calling:\n"
    ~ "    LINE_PURGE        -> NEXUS_ADAPTIVE_PURGE PATTERN=line\n"
    ~ "    VORON_PURGE       -> NEXUS_ADAPTIVE_PURGE PATTERN=double\n"
    ~ "    SMART_PARK        -> NEXUS_SMART_PARK\n"
    ~ "    ADAPTIVE_BED_MESH -> NEXUS_ADAPTIVE_MESH\n"
    ~ "\n"
    ~ "  Not forwarded - these have no KAMP equivalent and are the reason\n"
    ~ "  to migrate the start G-code rather than keep the shim:\n"
    ~ "    thermal pre-flight at " ~ C.probe_temp ~ "C\n"
    ~ "    nozzle scrubbing before the authoritative Z reference\n"
    ~ "    computed dynamic Z-offset\n"
    ~ "    commissioning dry run\n"
    ~ "\n"
    ~ "  Target slicer start G-code:\n"
    ~ "    NEXUS_START_PRINT BED=... EXTRUDER=... NOZZLE=... LAYER=... MATERIAL=...\n"
    ~ "\n"
    ~ "  Settings move from KAMP_Settings.cfg to [gcode_macro _NEXUS_AZM_CONF].\n"
    ~ "  Remove this include once the profiles are updated."
  )}
